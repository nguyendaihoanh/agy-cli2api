<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="agy-cli2api Banner">
  <defs>
    <!-- Warm Milky Cream Canvas (FnBOps Light Mode Aesthetic) -->
    <linearGradient id="creamCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="55%" stop-color="#FAF5EC" />
      <stop offset="100%" stop-color="#F2E9DA" />
    </linearGradient>

    <!-- Vault Concrete & Brushed Steel -->
    <linearGradient id="vaultBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="vaultDoor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="55%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Siphon Flow Gradient (Terracotta -> Amber -> Emerald) -->
    <linearGradient id="siphonFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EE5D36" />
      <stop offset="48%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Caution Stripe Pattern -->
    <pattern id="cautionStripe" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="16" fill="#F59E0B" />
      <rect x="8" width="8" height="16" fill="#1C1917" />
    </pattern>

    <!-- Soft Drop Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1C1917" flood-opacity="0.10" />
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1C1917" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Base Milky Cream Background -->
  <rect width="1200" height="480" fill="url(#creamCanvas)" />

  <!-- Subtle Blueprint Grid -->
  <g stroke="#E6DDD0" stroke-width="1" opacity="0.65">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="120" y1="0" x2="120" y2="480" />
    <line x1="240" y1="0" x2="240" y2="480" />
    <line x1="360" y1="0" x2="360" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" />
    <line x1="600" y1="0" x2="600" y2="480" />
    <line x1="720" y1="0" x2="720" y2="480" />
    <line x1="840" y1="0" x2="840" y2="480" />
    <line x1="960" y1="0" x2="960" y2="480" />
    <line x1="1080" y1="0" x2="1080" y2="480" />
  </g>

  <!-- Soft Warm Ambient Circles -->
  <circle cx="210" cy="240" r="210" fill="#EE5D36" opacity="0.05" />
  <circle cx="960" cy="290" r="220" fill="#10B981" opacity="0.06" />

  <!-- ==================== CHEEKY HARD-HAT RACCOON STANDING BEHIND PIPE ==================== -->
  <g id="cheeky-plumber" transform="translate(494, 282)" filter="url(#softShadow)">
    <!-- Speech Bubble -->
    <g transform="translate(68, -6)">
      <rect x="0" y="0" width="84" height="26" rx="13" fill="#FFFFFF" stroke="#1C1917" stroke-width="2" />
      <path d="M 8 20 L -5 27 L 16 23 Z" fill="#FFFFFF" stroke="#1C1917" stroke-width="2" stroke-linejoin="round" />
      <rect x="3" y="18" width="15" height="6" fill="#FFFFFF" />
      <text x="42" y="17" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" fill="#EE5D36">YOINK! :)</text>
    </g>

    <!-- Safety Vest Torso (Extends behind pipe) -->
    <path d="M 16 56 Q 42 48 68 56 L 74 106 H 10 Z" fill="#EE5D36" stroke="#1C1917" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Reflective Stripes -->
    <rect x="20" y="62" width="8" height="36" fill="#FEF08A" />
    <rect x="56" y="62" width="8" height="36" fill="#FEF08A" />
    <rect x="13" y="82" width="58" height="6" fill="#FEF08A" />

    <!-- Ears -->
    <polygon points="20,26 14,10 32,18" fill="#64748B" stroke="#1C1917" stroke-width="2.5" stroke-linejoin="round" />
    <polygon points="64,26 70,10 52,18" fill="#64748B" stroke="#1C1917" stroke-width="2.5" stroke-linejoin="round" />

    <!-- Raccoon Head -->
    <ellipse cx="42" cy="38" rx="25" ry="20" fill="#CBD5E1" stroke="#1C1917" stroke-width="2.5" />
    <!-- Cool Shades -->
    <rect x="20" y="29" width="44" height="13" rx="6" fill="#1C1917" />
    <line x1="26" y1="33" x2="34" y2="33" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.85" />
    <line x1="48" y1="33" x2="56" y2="33" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.85" />
    <!-- Snout + Smug Grin -->
    <ellipse cx="42" cy="48" rx="11" ry="8" fill="#FFFDF9" />
    <circle cx="42" cy="45" r="3" fill="#1C1917" />
    <path d="M 35 50 Q 44 55 50 48" fill="none" stroke="#1C1917" stroke-width="2.2" stroke-linecap="round" />

    <!-- Yellow Construction Hard Hat -->
    <path d="M 16 24 A 26 22 0 0 1 68 24 Z" fill="#F59E0B" stroke="#1C1917" stroke-width="2.5" />
    <rect x="37" y="4" width="10" height="18" rx="3" fill="#FBBF24" stroke="#1C1917" stroke-width="2" />
    <rect x="11" y="22" width="62" height="6" rx="3" fill="#D97706" stroke="#1C1917" stroke-width="2" />

    <!-- Left Arm & True C-Jaw Silver Wrench -->
    <path d="M 17 66 L -2 80" stroke="#1C1917" stroke-width="7" stroke-linecap="round" />
    <path d="M 17 66 L -2 80" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" />
    <g transform="translate(-20, 68) rotate(-25)">
      <rect x="10" y="6" width="20" height="6.5" rx="3" fill="#94A3B8" stroke="#1C1917" stroke-width="2" />
      <path d="M 12 4 A 7 7 0 1 0 12 14.5 L 6 12 A 3 3 0 1 1 6 6.5 Z" fill="#CBD5E1" stroke="#1C1917" stroke-width="2" stroke-linejoin="round" />
    </g>

    <!-- Right Arm Thumbs Up -->
    <circle cx="75" cy="74" r="6" fill="#CBD5E1" stroke="#1C1917" stroke-width="2" />
    <line x1="75" y1="68" x2="75" y2="61" stroke="#1C1917" stroke-width="4.5" stroke-linecap="round" />
    <line x1="75" y1="68" x2="75" y2="61" stroke="#CBD5E1" stroke-width="2.2" stroke-linecap="round" />
  </g>

  <!-- ==================== LEFT: OVER-ENGINEERED "GOOGLE CLI" VAULT ==================== -->
  <g id="cli-vault" transform="translate(46, 74)" filter="url(#cardShadow)">
    <!-- Concrete & Steel Vault Shell -->
    <rect x="0" y="0" width="312" height="332" rx="18" fill="url(#vaultBody)" stroke="#334155" stroke-width="3.5" />
    <rect x="14" y="14" width="284" height="304" rx="12" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" />

    <!-- Diagonal Hazard Tape across top-left corner -->
    <g transform="translate(10, 26) rotate(-18)">
      <rect x="-12" y="0" width="128" height="16" rx="2" fill="url(#cautionStripe)" stroke="#1C1917" stroke-width="1.5" />
    </g>

    <!-- Heavy Circular Vault Door -->
    <circle cx="156" cy="148" r="104" fill="url(#vaultDoor)" stroke="#1E293B" stroke-width="4" />
    <circle cx="156" cy="148" r="88" fill="#0F172A" stroke="#64748B" stroke-width="2" stroke-dasharray="7,5" />

    <!-- Steel Locking Spokes -->
    <rect x="150" y="34" width="12" height="228" rx="4" fill="#64748B" opacity="0.65" />
    <rect x="42" y="142" width="228" height="12" rx="4" fill="#64748B" opacity="0.65" />
    <rect x="74" y="142" width="164" height="10" rx="4" fill="#475569" opacity="0.65" transform="rotate(45 156 148)" />
    <rect x="74" y="142" width="164" height="10" rx="4" fill="#475569" opacity="0.65" transform="rotate(-45 156 148)" />

    <!-- Center Vault Wheel + Antigravity Monogram -->
    <circle cx="156" cy="148" r="48" fill="#FFFDF9" stroke="#94A3B8" stroke-width="4" />
    <path d="M 156 118 L 178 166 L 134 166 Z" fill="none" stroke="#EE5D36" stroke-width="4.5" stroke-linejoin="round" />
    <line x1="143" y1="152" x2="169" y2="152" stroke="#EE5D36" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="156" cy="138" r="3.5" fill="#007AFF" />

    <!-- Corner Rivets -->
    <circle cx="32" cy="32" r="5" fill="#64748B" />
    <circle cx="280" cy="32" r="5" fill="#64748B" />
    <circle cx="32" cy="300" r="5" fill="#64748B" />
    <circle cx="280" cy="300" r="5" fill="#64748B" />

    <!-- Comically Strict Front Padlock Badge -->
    <rect x="34" y="266" width="244" height="34" rx="7" fill="#FFF1F2" stroke="#EF4444" stroke-width="2" />
    <circle cx="52" cy="283" r="4.5" fill="#EF4444" />
    <text x="66" y="288" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" fill="#B91C1C" letter-spacing="0.4">LOCKED: CLI ONLY (NO PEEKING)</text>

    <!-- Drilled Breach & Cracks on the Right Wall -->
    <g transform="translate(292, 212)">
      <path d="M -8 -16 L -18 -26 M -4 -18 L -6 -32 M -10 18 L -22 28 M -2 20 L 2 30" stroke="#334155" stroke-width="2" stroke-linecap="round" />
      <rect x="-10" y="-18" width="26" height="36" rx="5" fill="#1C1917" stroke="#F59E0B" stroke-width="2.5" />
      <circle cx="-18" cy="32" r="3" fill="#94A3B8" />
      <circle cx="22" cy="28" r="2.5" fill="#64748B" />
    </g>
  </g>

  <!-- ==================== CENTER: SNEAKY PLUMBING SIPHON PIPE ==================== -->
  <g id="siphon-pipeline">
    <!-- Pipe Outer Dark Outline -->
    <path d="M 354 304
             C 425 304, 445 386, 520 386
             L 725 386
             C 785 386, 805 320, 860 320
             L 882 320"
          fill="none" stroke="#1C1917" stroke-width="32" stroke-linecap="round" />

    <!-- Clear Glass Pipe Body -->
    <path d="M 354 304
             C 425 304, 445 386, 520 386
             L 725 386
             C 785 386, 805 320, 860 320
             L 882 320"
          fill="none" stroke="#FFFDF9" stroke-width="25" stroke-linecap="round" />

    <!-- Flowing Data Stream Inside -->
    <path d="M 354 304
             C 425 304, 445 386, 520 386
             L 725 386
             C 785 386, 805 320, 860 320
             L 882 320"
          fill="none" stroke="url(#siphonFlow)" stroke-width="13" stroke-linecap="round" />

    <!-- Specular Glass Highlight -->
    <path d="M 366 297
             C 430 297, 448 379, 520 379
             L 725 379
             C 782 379, 802 313, 860 313"
          fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.7" />

    <!-- Pipe Clamps / Duct Tape Collars -->
    <rect x="462" y="366" width="16" height="40" rx="4" fill="#94A3B8" stroke="#1C1917" stroke-width="2" />
    <rect x="615" y="366" width="16" height="40" rx="4" fill="#94A3B8" stroke="#1C1917" stroke-width="2" />
    <rect x="765" y="346" width="16" height="40" rx="4" fill="#94A3B8" stroke="#1C1917" stroke-width="2" transform="rotate(-32 773 366)" />

    <!-- Comic Leaking Droplet & Tiny Espresso Cup Under Clamp -->
    <path d="M 470 409 Q 475 419 470 423 Q 465 419 470 409 Z" fill="#EE5D36" />
    <g transform="translate(454, 429)">
      <path d="M 2 0 H 30 V 14 A 10 10 0 0 1 20 24 H 12 A 10 10 0 0 1 2 14 Z" fill="#FFFFFF" stroke="#1C1917" stroke-width="2" />
      <path d="M 30 4 H 36 A 4 4 0 0 1 36 14 H 30" fill="none" stroke="#1C1917" stroke-width="2" />
      <rect x="5" y="3" width="22" height="5" rx="2" fill="#EE5D36" />
    </g>

    <!-- Pressure Gauge & Valve ("0.2s AUTO-SWAP") -->
    <g transform="translate(603, 304)" filter="url(#softShadow)">
      <line x1="20" y1="62" x2="20" y2="34" stroke="#1C1917" stroke-width="6" />
      <circle cx="20" cy="20" r="22" fill="#FFFDF9" stroke="#1C1917" stroke-width="3" />
      <path d="M 7 24 A 14 14 0 0 1 33 24" fill="none" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round" />
      <path d="M 24 8 A 14 14 0 0 1 33 24" fill="none" stroke="#10B981" stroke-width="4" stroke-linecap="round" />
      <line x1="20" y1="20" x2="32" y2="11" stroke="#EE5D36" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="20" cy="20" r="3.5" fill="#1C1917" />
      <!-- Tag -->
      <rect x="48" y="8" width="114" height="24" rx="6" fill="#ECFDF5" stroke="#10B981" stroke-width="1.8" />
      <text x="105" y="24" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="800" fill="#047857">0.2s AUTO-SWAP</text>
    </g>

    <!-- Cheeky Tilted Sticker Over the Drilled Pipe -->
    <g transform="translate(382, 212) rotate(-5)" filter="url(#softShadow)">
      <rect x="0" y="0" width="184" height="28" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="2" />
      <text x="92" y="18" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="800" fill="#92400E">TOTALLY NORMAL PLUMBING</text>
    </g>

    <!-- Floating Tokens Outflow (Cleanly spaced away from pipe) -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="800">
      <text x="804" y="286" font-size="13" fill="#10B981">{ }</text>
      <text x="838" y="294" font-size="12" fill="#EE5D36">[ ]</text>
      <text x="818" y="368" font-size="11" fill="#007AFF">0101</text>
      <polygon points="866,310 886,320 866,330" fill="#10B981" />
    </g>
  </g>

  <!-- ==================== RIGHT: CRISP LIGHT-MODE API RECEPTACLE ==================== -->
  <g id="api-card" transform="translate(886, 198)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="268" height="196" rx="14" fill="#FFFFFF" stroke="#D6CFC4" stroke-width="2.5" />
    <!-- Top Bar -->
    <path d="M 0 14 A 14 14 0 0 1 14 0 H 254 A 14 14 0 0 1 268 14 V 34 H 0 Z" fill="#F5EFE6" />
    <line x1="0" y1="34" x2="268" y2="34" stroke="#E6DDD0" stroke-width="1.5" />
    <circle cx="18" cy="17" r="4.5" fill="#EF4444" />
    <circle cx="34" cy="17" r="4.5" fill="#F59E0B" />
    <circle cx="50" cy="17" r="4.5" fill="#10B981" />
    <text x="74" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700" fill="#57534E">127.0.0.1:7862</text>

    <!-- Endpoint -->
    <text x="16" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="800" fill="#EE5D36">POST /v1/chat/completions</text>

    <!-- JSON Payloads -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">
      <rect x="16" y="74" width="236" height="28" rx="6" fill="#FAF6EE" stroke="#E6DDD0" stroke-width="1" />
      <text x="24" y="92" font-weight="700" fill="#059669">HTTP 200 {"status": "ok"}</text>

      <rect x="16" y="110" width="236" height="28" rx="6" fill="#FAF6EE" stroke="#E6DDD0" stroke-width="1" />
      <text x="24" y="128" font-weight="600" fill="#0284C7">{"choices":[{"delta":{...}}]}</text>

      <!-- Bottom Badge -->
      <rect x="16" y="148" width="150" height="30" rx="8" fill="#10B981" />
      <text x="91" y="167" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">OpenAI Compatible</text>
    </g>
  </g>

  <!-- Rubber Stamp Under API Card -->
  <g transform="translate(896, 412) rotate(-2.5)">
    <rect x="0" y="0" width="248" height="28" rx="6" fill="none" stroke="#EE5D36" stroke-width="1.8" stroke-dasharray="5,3" opacity="0.75" />
    <text x="124" y="18" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="800" fill="#EE5D36" opacity="0.85">LOCAL ADAPTER • NO REFUNDS</text>
  </g>

  <!-- ==================== HEADER TYPOGRAPHY & PILLS ==================== -->
  <g id="header" transform="translate(402, 54)">
    <text x="0" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="900" fill="#1C1917" letter-spacing="-0.8">agy-cli2api</text>

    <!-- Terracotta Badge -->
    <rect x="242" y="8" width="136" height="28" rx="8" fill="#FFF1EC" stroke="#EE5D36" stroke-width="1.8" />
    <text x="310" y="26" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="800" fill="#C2410C">SIPHON GATEWAY</text>

    <!-- Subtitle -->
    <text x="0" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="600" fill="#57534E">Antigravity CLI to OpenAI API • Multi-Account Auto-Swap • Protobuf Parser</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 84)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700" filter="url(#softShadow)">
      <rect x="0" y="0" width="132" height="30" rx="8" fill="#FFFFFF" stroke="#E6DDD0" stroke-width="1.5" />
      <circle cx="15" cy="15" r="4" fill="#10B981" />
      <text x="27" y="19" fill="#1C1917">0.2s Failover</text>

      <rect x="144" y="0" width="154" height="30" rx="8" fill="#FFFFFF" stroke="#E6DDD0" stroke-width="1.5" />
      <circle cx="159" cy="15" r="4" fill="#EE5D36" />
      <text x="171" y="19" fill="#1C1917">Pure-Python Core</text>

      <rect x="310" y="0" width="154" height="30" rx="8" fill="#FFFFFF" stroke="#E6DDD0" stroke-width="1.5" />
      <circle cx="325" cy="15" r="4" fill="#F59E0B" />
      <text x="337" y="19" fill="#1C1917">Protobuf Decoded</text>
    </g>
  </g>
</svg>
